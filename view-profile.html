<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Profile | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf6f2;
      color: #35242b;
    }
    header {
      background: white;
      padding: 18px 5%;
      border-bottom: 1px solid #eadfe2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-size: 22px;
      font-weight: bold;
      color: #581b32;
      text-decoration: none;
    }
    .brand span { color: #b76e79; }
    .button {
      display: inline-block;
      padding: 11px 16px;
      background: #581b32;
      color: white;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    main { width: min(760px, 92%); margin: 35px auto; }
    .profile-card {
      background: white;
      border: 1px solid #eadfe2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px #35101f12;
    }
    .cover {
      height: 10px;
      background: linear-gradient(90deg,#35101f,#b76e79,#d6b47a);
    }
    .profile-content { padding: 28px; }
    .photo {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      border: 4px solid #d6b47a;
      background: #f5e8e9;
    }
    h1 {
      text-align: center;
      color: #581b32;
      font-family: Georgia, serif;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }
    .subtitle { text-align: center; color: #81727a; margin: 0 0 25px; }
    .usage {
      margin-bottom: 22px;
      padding: 15px;
      border: 1px solid #e8d1b0;
      border-radius: 10px;
      background: #fffaf1;
      line-height: 1.8;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .detail {
      background: #fcf7f7;
      border: 1px solid #eadfe2;
      border-radius: 10px;
      padding: 14px;
      overflow-wrap: anywhere;
    }
    .detail strong {
      display: block;
      color: #81727a;
      font-size: 12px;
      margin-bottom: 7px;
    }
    .detail span { font-size: 15px; font-weight: bold; }
    .contact {
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #eadfe2;
      border-radius: 10px;
      background: #fcf7f7;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }
    .actions { text-align: center; margin-top: 25px; }
    #message {
      text-align: center;
      padding: 25px;
      color: #81727a;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
    .secondary { background: #77666e; }
    [hidden] { display: none !important; }
    @media (max-width: 500px) {
      .profile-content { padding: 18px; }
      .details { grid-template-columns: 1fr; }
      .photo { width: 145px; height: 145px; }
      .brand { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Pasand<span>Matrimony</span></a>
    <a class="button" href="profiles.html">Back to Profiles</a>
  </header>

  <main>
    <section class="profile-card">
      <div class="cover"></div>
      <div id="message" role="status" aria-live="polite">Loading profile...</div>

      <div id="profileContent" class="profile-content" hidden>
        <img id="photo" class="photo" alt="Member profile photo" hidden>
        <h1 id="name"></h1>
        <p class="subtitle">PasandMatrimony Member</p>

        <div class="usage">
          <strong>Membership Usage</strong><br>
          Status: <span id="membershipStatus">Checking...</span><br>
          Profiles Viewed: <span id="profilesViewed">—</span> / 10<br>
          Profiles Remaining: <span id="profilesRemaining">—</span><br>
          Membership Expiry: <span id="expiryDate">—</span>
        </div>

        <div class="details">
          <div class="detail"><strong>Age</strong><span id="age"></span></div>
          <div class="detail"><strong>Gender</strong><span id="gender"></span></div>
          <div class="detail"><strong>City</strong><span id="city"></span></div>
          <div class="detail"><strong>Education</strong><span id="education"></span></div>
          <div class="detail"><strong>Marital Status</strong><span id="status"></span></div>
        </div>

        <div id="contactBox" class="contact" hidden>
          <strong>Contact Details</strong><br>
          Mobile: <span id="mobile"></span><br>
          Email: <span id="email"></span>
        </div>

        <div class="actions">
          <a class="button" href="membership.html">Get Premium Membership</a>
          <a class="button secondary" href="profiles.html">Explore More Profiles</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    "use strict";

    function getClient() {
      if (typeof supabaseClient !== "undefined") return supabaseClient;
      if (window.supabaseClient) return window.supabaseClient;
      return null;
    }

    function setText(id, value) {
      document.getElementById(id).textContent =
        value === null || value === undefined || value === ""
          ? "Not specified"
          : String(value);
    }

    function showMessage(text) {
      document.getElementById("message").textContent = text;
      document.getElementById("message").hidden = false;
      document.getElementById("profileContent").hidden = true;
    }

    function formatDate(value) {
      if (!value) return "Not active";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "Not available" : date.toLocaleString();
    }

    async function initialize() {
      const client = getClient();

      try {
        if (!client) throw new Error("Website configuration is unavailable.");

        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session?.user) {
          window.location.replace("login.html?next=view-profile.html");
          return;
        }

        const profileId = new URLSearchParams(window.location.search).get("id");

        if (!profileId) {
          showMessage("No profile was selected. Please return to the profile list.");
          return;
        }

        const { data, error } = await client.rpc(
          "view_profile_with_contact",
          { p_profile_id: profileId }
        );

        if (error) {
          const errorText = error.message || "";

          if (errorText.includes("active paid membership")) {
            showMessage("An active Premium Membership is required to view contact details.");
          } else if (errorText.includes("10-profile limit")) {
            showMessage("You have reached your 10-profile limit. Please renew your membership.");
          } else {
            showMessage(errorText || "Unable to load this profile.");
          }
          return;
        }

        const profile = data?.profile;

        if (!profile) {
          showMessage("This profile is unavailable.");
          return;
        }

        const { data: ownProfile, error: ownError } = await client
          .from("profiles")
          .select("membership_status, membership_expires_at")
          .eq("id", sessionData.session.user.id)
          .maybeSingle();

        if (ownError) throw ownError;

        const expiry = data.membership_expires_at ||
          ownProfile?.membership_expires_at;

        setText("name", profile.full_name);
        setText("age", profile.age ? profile.age + " years" : "");
        setText("gender", profile.gender);
        setText("city", profile.city);
        setText("education", profile.education);
        setText("status", profile.marital_status);

        setText("profilesViewed", data.profiles_viewed);
        setText("profilesRemaining", data.profiles_remaining);
        setText("expiryDate", formatDate(expiry));
        setText("membershipStatus", "Active");

        if (profile.photo_url && profile.photo_url.startsWith("https://")) {
          const photo = document.getElementById("photo");
          photo.src = profile.photo_url;
          photo.hidden = false;
          photo.onerror = function () { photo.hidden = true; };
        }

        setText("mobile", profile.mobile);
        setText("email", profile.email);
        document.getElementById("contactBox").hidden = false;

        document.getElementById("message").hidden = true;
        document.getElementById("profileContent").hidden = false;

      } catch (error) {
        console.error("Profile view error:", error);
        showMessage("Unable to load this profile. Please try again.");
      }
    }

    initialize();
  </script>
</body>
</html>
