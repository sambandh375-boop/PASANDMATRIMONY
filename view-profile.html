<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>View Profile | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #faf6f2;
      color: #35242b;
    }
    header {
      background: white;
      padding: 18px 5%;
      border-bottom: 1px solid #eadfe2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .brand {
      font-size: 22px;
      font-weight: bold;
      color: #581b32;
      text-decoration: none;
    }
    .brand span { color: #b76e79; }
    .button {
      display: inline-block;
      padding: 11px 16px;
      background: #581b32;
      color: white;
      border: 0;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
    }
    main {
      width: min(760px, 92%);
      margin: 35px auto;
    }
    .profile-card {
      background: white;
      border: 1px solid #eadfe2;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 30px #35101f12;
    }
    .cover {
      height: 10px;
      background: linear-gradient(90deg, #35101f, #b76e79, #d6b47a);
    }
    .profile-content { padding: 28px; }
    .photo {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      margin: 0 auto 20px;
      border: 4px solid #d6b47a;
      background: #f5e8e9;
    }
    h1 {
      text-align: center;
      color: #581b32;
      font-family: Georgia, serif;
      margin: 0 0 8px;
      overflow-wrap: anywhere;
    }
    .subtitle {
      text-align: center;
      color: #81727a;
      margin: 0 0 25px;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .detail {
      background: #fcf7f7;
      border: 1px solid #eadfe2;
      border-radius: 10px;
      padding: 14px;
      overflow-wrap: anywhere;
    }
    .detail strong {
      display: block;
      color: #81727a;
      font-size: 12px;
      margin-bottom: 7px;
    }
    .detail span { font-size: 15px; font-weight: bold; }
    .actions { text-align: center; margin-top: 25px; }
    #message {
      text-align: center;
      padding: 25px;
      color: #81727a;
      overflow-wrap: anywhere;
    }
    @media (max-width: 500px) {
      .profile-content { padding: 18px; }
      .details { grid-template-columns: 1fr; }
      .photo { width: 145px; height: 145px; }
      .brand { font-size: 19px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="index.html">Pasand<span>Matrimony</span></a>
    <a class="button" href="profiles.html">Back to Profiles</a>
  </header>

  <main>
    <section class="profile-card">
      <div class="cover"></div>
      <div id="message">Loading profile...</div>

      <div id="profileContent" class="profile-content" hidden>
        <img id="photo" class="photo" alt="Member profile photo" hidden>
        <h1 id="name"></h1>
        <p id="subtitle" class="subtitle">PasandMatrimony Member</p>

        <div class="details">
          <div class="detail">
            <strong>Age</strong>
            <span id="age"></span>
          </div>
          <div class="detail">
            <strong>Gender</strong>
            <span id="gender"></span>
          </div>
          <div class="detail">
            <strong>City</strong>
            <span id="city"></span>
          </div>
          <div class="detail">
            <strong>Education</strong>
            <span id="education"></span>
          </div>
          <div class="detail">
            <strong>Marital Status</strong>
            <span id="status"></span>
          </div>
        </div>

        <div class="actions">
          <a class="button" href="profiles.html">Explore More Profiles</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    function getClient() {
      if (typeof supabaseClient !== "undefined") return supabaseClient;
      if (window.supabaseClient) return window.supabaseClient;
      return null;
    }

    function showError(text) {
      const message = document.getElementById("message");
      message.hidden = false;
      message.textContent = text;
    }

    function setText(id, value) {
      document.getElementById(id).textContent = value || "Not specified";
    }

    async function initialize() {
      try {
        const client = getClient();
        if (!client) throw new Error("Website configuration is unavailable.");

        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();
        if (sessionError) throw sessionError;

        const user = sessionData.session?.user;
        if (!user) {
          window.location.replace("login.html?next=view-profile.html");
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const profileId = params.get("id");

        if (!profileId) {
          showError("No profile was selected. Please return to the profile list.");
          return;
        }

        const { data: ownProfile, error: ownError } = await client
          .from("profiles")
          .select("gender")
          .eq("id", user.id)
          .maybeSingle();

        if (ownError) throw ownError;
        if (!ownProfile?.gender) {
          showError("Please complete your own profile first.");
          return;
        }

        const { data, error } = await client.rpc(
          "get_opposite_gender_profiles"
        );
        if (error) throw error;

        const profile = (data || []).find(function (item) {
          return item.id === profileId;
        });

        if (!profile) {
          showError("This profile is unavailable or is not an eligible match.");
          return;
        }

        const photoUrl = profile.photo_url || "";
        if (photoUrl.startsWith("https://")) {
          const photo = document.getElementById("photo");
          photo.src = photoUrl;
          photo.hidden = false;
          photo.onerror = function () {
            photo.hidden = true;
          };
        }

        setText("name", profile.full_name);
        setText("age", profile.age ? profile.age + " years" : "");
        setText("gender", profile.gender);
        setText("city", profile.city);
        setText("education", profile.education);
        setText("status", profile.marital_status);

        document.getElementById("subtitle").textContent =
          "PasandMatrimony Member";

        document.getElementById("message").hidden = true;
        document.getElementById("profileContent").hidden = false;

      } catch (error) {
        console.error("Profile view error:", error);
        showError("Unable to load this profile. Please try again.");
      }
    }

    initialize();
  </script>
</body>
</html>
