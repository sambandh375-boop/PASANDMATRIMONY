<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>लॉगिन | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff5f7;
      color: #35212b;
    }
    .card {
      max-width: 450px;
      margin: 35px auto;
      padding: 28px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 28px #761c4018;
    }
    h1 { text-align: center; color: #761c40; }
    label { display: block; margin: 17px 0 6px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #761c40;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    p { text-align: center; overflow-wrap: anywhere; }
    a { color: #761c40; }
  </style>
</head>
<body>
  <main class="card">
    <h1>❤️ PasandMatrimony</h1>
    <p>अपने अकाउंट में लॉगिन करें</p>

    <form id="loginForm">
      <label for="email">ईमेल</label>
      <input id="email" type="email"
             autocomplete="email" required>

      <label for="password">पासवर्ड</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">लॉगिन करें</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>नया अकाउंट? <a href="register.html">रजिस्ट्रेशन करें</a></p>
    <p><a href="index.html">होम पेज</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const button = document.getElementById("loginButton");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "लॉगिन जाँच रहे हैं...";

      try {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({
            email,
            password
          });

        if (error) throw error;

        if (!data.session) {
          throw new Error("लॉगिन सत्र नहीं मिला। दोबारा प्रयास करें।");
        }

        message.textContent = "लॉगिन सफल! प्रोफाइल पेज खोला जा रहा है...";
        window.location.href = "profile.html";
      } catch (error) {
        message.textContent = "लॉगिन नहीं हुआ: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
