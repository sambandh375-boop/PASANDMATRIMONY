<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore Profiles | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #faf6f2;
      color: #35242b;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }
    .brand { color: #581b32; font-size: 23px; font-weight: bold; }
    .brand span { color: #b76e79; }
    button, .button {
      padding: 10px 14px;
      border: 0;
      border-radius: 7px;
      background: #581b32;
      color: white;
      cursor: pointer;
      text-decoration: none;
      font-size: 13px;
    }
    h1 { color: #581b32; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0;
    }
    input, select {
      min-height: 42px;
      padding: 10px;
      border: 1px solid #e5d8dd;
      border-radius: 7px;
      background: white;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    .card {
      overflow: hidden;
      background: white;
      border: 1px solid #eadfe2;
      border-radius: 12px;
      box-shadow: 0 5px 18px #35101f0d;
    }
    .photo {
      width: 100%;
      height: 190px;
      object-fit: cover;
      background: #f5e8e9;
    }
    .details { padding: 13px; }
    .details h3 { margin: 0 0 9px; color: #581b32; }
    .details p { margin: 6px 0; font-size: 13px; overflow-wrap: anywhere; }
    .details .button { display: block; text-align: center; margin-top: 12px; }
    #message { margin: 18px 0; line-height: 1.6; }
    @media (max-width: 800px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .photo { height: 170px; }
    }
    @media (max-width: 380px) {
      body { padding: 12px; }
      .grid { gap: 10px; }
      .photo { height: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Pasand<span>Matrimony</span></div>
    <nav>
      <a class="button" href="profile.html">My Profile</a>
      <button id="logoutButton" type="button">Log Out</button>
    </nav>
  </header>

  <h1>Explore Profiles</h1>
  <p>Discover profiles that may be compatible with you.</p>

  <div class="filters">
    <input id="cityFilter" type="text" placeholder="Filter by city">
    <input id="minAge" type="number" min="18" max="100" placeholder="Min age">
    <input id="maxAge" type="number" min="18" max="100" placeholder="Max age">
    <button id="filterButton" type="button">Apply Filters</button>
    <button id="clearButton" type="button">Clear</button>
  </div>

  <p id="message" role="status">Loading profiles...</p>
  <main id="profilesGrid" class="grid"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    "use strict";

    const client = typeof supabaseClient !== "undefined"
      ? supabaseClient
      : window.supabaseClient;

    const grid = document.getElementById("profilesGrid");
    const message = document.getElementById("message");
    let allProfiles = [];

    function showMessage(text) {
      message.textContent = text;
    }

    function addText(parent, tag, text, className) {
      const element = document.createElement(tag);
      element.textContent = text;
      if (className) element.className = className;
      parent.appendChild(element);
      return element;
    }

    function renderProfiles(profiles) {
      grid.replaceChildren();

      if (!profiles.length) {
        showMessage("No matching profiles found.");
        return;
      }

      showMessage(profiles.length + " profile(s) found.");

      profiles.forEach(function (profile) {
        const card = document.createElement("article");
        card.className = "card";

        if (profile.photo_url) {
          const img = document.createElement("img");
          img.className = "photo";
          img.src = profile.photo_url;
          img.alt = "Profile photo";
          img.loading = "lazy";
          img.onerror = function () {
            img.remove();
          };
          card.appendChild(img);
        }

        const details = document.createElement("div");
        details.className = "details";

        addText(details, "h3", profile.full_name || "Member");
        addText(details, "p", "Age: " + (profile.age ?? "Not provided"));
        addText(details, "p", "City: " + (profile.city || "Not provided"));
        addText(details, "p", "Education: " + (profile.education || "Not provided"));
        addText(details, "p", "Marital Status: " + (profile.marital_status || "Not provided"));

        const link = document.createElement("a");
        link.className = "button";
        link.href = "view-profile.html?id=" + encodeURIComponent(profile.id);
        link.textContent = "View Profile";
        details.appendChild(link);

        card.appendChild(details);
        grid.appendChild(card);
      });
    }

    function applyFilters() {
      const city = document.getElementById("cityFilter").value.trim().toLowerCase();
      const minAge = Number(document.getElementById("minAge").value) || 0;
      const maxAge = Number(document.getElementById("maxAge").value) || 120;

      const filtered = allProfiles.filter(function (profile) {
        const matchesCity = !city ||
          (profile.city || "").toLowerCase().includes(city);
        const age = Number(profile.age) || 0;
        return matchesCity && age >= minAge && age <= maxAge;
      });

      renderProfiles(filtered);
    }

    async function loadProfiles() {
      if (!client) {
        showMessage("Website configuration could not be loaded. Check supabase-config.js.");
        return;
      }

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        if (!sessionData.session) {
          window.location.replace("login.html");
          return;
        }

        const { data: ownProfile, error: ownError } = await client
          .from("profiles")
          .select("gender")
          .eq("id", sessionData.session.user.id)
          .maybeSingle();

        if (ownError) throw ownError;

        if (!ownProfile || !ownProfile.gender) {
          showMessage("Please complete your profile and select your gender first.");
          return;
        }

        const { data, error } = await client.rpc("get_opposite_gender_profiles");
        if (error) throw error;

        allProfiles = data || [];
        renderProfiles(allProfiles);

      } catch (error) {
        console.error("Loading profiles failed:", error);
        showMessage("Unable to load profiles: " + error.message);
      }
    }

    document.getElementById("filterButton").addEventListener("click", applyFilters);

    document.getElementById("clearButton").addEventListener("click", function () {
      document.getElementById("cityFilter").value = "";
      document.getElementById("minAge").value = "";
      document.getElementById("maxAge").value = "";
      renderProfiles(allProfiles);
    });

    document.getElementById("logoutButton").addEventListener("click", async function () {
      if (!client) return;
      const { error } = await client.auth.signOut();
      if (error) {
        showMessage("Unable to log out: " + error.message);
        return;
      }
      window.location.replace("login.html");
    });

    loadProfiles();
  </script>
</body>
</html>
