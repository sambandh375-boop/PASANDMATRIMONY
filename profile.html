<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#581b32">
  <title>Discover Profiles | PasandMatrimony</title>

  <style>
    :root {
      --wine: #581b32;
      --dark: #35101f;
      --rose: #b76e79;
      --gold: #d6b47a;
      --cream: #faf6f2;
      --ink: #35242b;
      --muted: #81727a;
      --line: #eadfe2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    a { color: inherit; text-decoration: none; }

    .container {
      width: min(1180px, 94%);
      margin: auto;
    }

    .topbar {
      background: white;
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 5;
    }

    .nav {
      min-height: 68px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .brand {
      font-size: 23px;
      font-weight: 800;
      color: var(--wine);
    }

    .brand span { color: var(--rose); }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .button {
      display: inline-block;
      border: 0;
      border-radius: 7px;
      background: var(--wine);
      color: white;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
    }

    .button:hover { background: var(--dark); }

    .button-outline {
      color: var(--wine);
      background: white;
      border: 1px solid var(--line);
    }

    .heading {
      padding: 36px 0 24px;
      text-align: center;
    }

    .eyebrow {
      color: var(--rose);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 800;
      font-size: 11px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0 0 9px;
      color: var(--wine);
      font-family: Georgia, serif;
      font-size: clamp(28px, 4vw, 39px);
    }

    .heading p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 12px;
      padding: 16px;
      margin-bottom: 22px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: white;
      font: inherit;
      color: var(--ink);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding-bottom: 45px;
    }

    .profile-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      box-shadow: 0 4px 15px rgba(53, 16, 31, .06);
    }

    .profile-card img,
    .photo-placeholder {
      display: block;
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #f5e8e9;
    }

    .photo-placeholder {
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--wine);
      font-size: 12px;
    }

    .card-content { padding: 12px; }

    .card-content h2 {
      color: var(--wine);
      font-size: 16px;
      margin: 0 0 7px;
      overflow-wrap: anywhere;
    }

    .card-content p {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      margin: 3px 0;
      overflow-wrap: anywhere;
    }

    .card-content .button {
      display: block;
      margin-top: 11px;
      width: 100%;
      padding: 9px 5px;
    }

    .message {
      grid-column: 1 / -1;
      padding: 24px 15px;
      text-align: center;
      color: var(--muted);
      background: white;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .footer {
      padding: 20px 0;
      background: var(--dark);
      color: #f5e7eb;
      text-align: center;
      font-size: 12px;
    }

    @media (max-width: 800px) {
      .profile-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .profile-card img,
      .photo-placeholder { height: 125px; }
    }

    @media (max-width: 520px) {
      .nav {
        align-items: flex-start;
        padding: 12px 0;
        flex-direction: column;
      }

      .brand { font-size: 21px; }

      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar .button { grid-column: 1 / -1; }

      .profile-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .profile-card img,
      .photo-placeholder { height: 125px; }

      .card-content { padding: 9px; }
      .card-content h2 { font-size: 14px; }
      .card-content p { font-size: 11px; }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="index.html">Pasand<span>Matrimony</span></a>

      <div class="nav-actions">
        <a class="button button-outline" href="profile.html">My Profile</a>
        <button class="button" id="logoutButton" type="button">Log Out</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="heading">
      <div class="eyebrow">Discover Connections</div>
      <h1>Find Your Perfect Match</h1>
      <p id="introText">Loading your matches...</p>
    </section>

    <section class="toolbar" aria-label="Profile filters">
      <div class="field">
        <label for="cityFilter">City</label>
        <input id="cityFilter" type="search" placeholder="Search by city">
      </div>

      <div class="field">
        <label for="ageFilter">Age Range</label>
        <select id="ageFilter">
          <option value="">Any Age</option>
          <option value="18-25">18–25 Years</option>
          <option value="26-30">26–30 Years</option>
          <option value="31-35">31–35 Years</option>
          <option value="36-40">36–40 Years</option>
          <option value="41-50">41–50 Years</option>
          <option value="51+">51+ Years</option>
        </select>
      </div>

      <button class="button" id="filterButton" type="button">Apply Filters</button>
    </section>

    <section id="profileGrid" class="profile-grid" aria-live="polite">
      <p class="message">Checking your account...</p>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      &copy; <span id="year"></span> PasandMatrimony. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    "use strict";

    const grid = document.getElementById("profileGrid");
    const introText = document.getElementById("introText");
    const cityFilter = document.getElementById("cityFilter");
    const ageFilter = document.getElementById("ageFilter");

    let allProfiles = [];

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function getClient() {
      if (typeof supabaseClient !== "undefined") return supabaseClient;
      if (window.supabaseClient) return window.supabaseClient;
      return null;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (c) {
        return {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        }[c];
      });
    }

    function safePhotoURL(value) {
      try {
        const url = new URL(String(value || ""));
        return url.protocol === "https:" ? url.href : "";
      } catch {
        return "";
      }
    }

    function showMessage(text) {
      grid.innerHTML = "";
      const p = document.createElement("p");
      p.className = "message";
      p.textContent = text;
      grid.appendChild(p);
    }

    function ageMatches(age, range) {
      if (!range) return true;

      const n = Number(age);
      if (!Number.isFinite(n)) return false;

      if (range === "51+") return n >= 51;

      const parts = range.split("-").map(Number);
      return n >= parts[0] && n <= parts[1];
    }

    function renderProfiles() {
      const city = cityFilter.value.trim().toLowerCase();
      const ageRange = ageFilter.value;

      const matches = allProfiles.filter(function (p) {
        const cityMatch = !city ||
          String(p.city || "").toLowerCase().includes(city);

        return cityMatch && ageMatches(p.age, ageRange);
      });

      if (!matches.length) {
        showMessage("No matching profiles found. Try changing your filters.");
        return;
      }

      grid.innerHTML = matches.map(function (p) {
        const name = escapeHTML(p.full_name || "Member");
        const age = p.age ? escapeHTML(p.age) + " years" : "Not specified";
        const cityName = escapeHTML(p.city || "Not specified");
        const education = escapeHTML(p.education || "Not specified");
        const status = escapeHTML(p.marital_status || "Not specified");
        const photo = safePhotoURL(p.photo_url);

        const picture = photo
          ? '<img src="' + escapeHTML(photo) +
            '" alt="Profile photo" loading="lazy">'
          : '<div class="photo-placeholder">Profile Photo</div>';

        return `
          <article class="profile-card">
            ${picture}
            <div class="card-content">
              <h2>${name}</h2>
              <p><strong>Age:</strong> ${age}</p>
              <p><strong>City:</strong> ${cityName}</p>
              <p><strong>Education:</strong> ${education}</p>
              <p><strong>Marital Status:</strong> ${status}</p>
              <a class="button" href="profile.html">My Profile</a>
            </div>
          </article>
        `;
      }).join("");
    }

    async function initialize() {
      const client = getClient();

      if (!client) {
        showMessage("The website configuration could not be loaded.");
        return;
      }

      try {
        const { data: sessionData, error: sessionError } =
          await client.auth.getSession();

        if (sessionError) throw sessionError;

        const user = sessionData.session?.user;

        if (!user) {
          window.location.replace("login.html?next=profiles.html");
          return;
        }

        const { data: ownProfile, error: ownError } = await client
          .from("profiles")
          .select("gender")
          .eq("id", user.id)
          .maybeSingle();

        if (ownError) throw ownError;

        if (!ownProfile || !ownProfile.gender) {
          introText.textContent = "Complete your profile to discover matches.";
          showMessage("Please complete and save your Gender in My Profile first.");
          return;
        }

        const gender = String(ownProfile.gender).toLowerCase();

        if (gender !== "male" && gender !== "female") {
          showMessage("Your Gender is incomplete. Please update My Profile.");
          return;
        }

        /*
          This RPC must enforce the opposite-gender filter in the database.
          It must return only approved public profile fields and exclude the
          current user's own profile.
        */
        const { data, error } = await client.rpc(
          "get_opposite_gender_profiles"
        );

        if (error) throw error;

        allProfiles = (data || []).filter(function (p) {
          return p.id !== user.id &&
            String(p.gender || "").toLowerCase() !== gender;
        });

        introText.textContent = gender === "male"
          ? "Explore women's profiles and discover your compatible match."
          : "Explore men's profiles and discover your compatible match.";

        renderProfiles();

      } catch (error) {
        console.error("Could not load matching profiles:", error);
        showMessage(
          "Profiles could not be loaded. Please check your database permissions and try again."
        );
      }
    }

    document.getElementById("filterButton").addEventListener(
      "click",
      renderProfiles
    );

    cityFilter.addEventListener("keydown", function (event) {
      if (event.key === "Enter") renderProfiles();
    });

    document.getElementById("logoutButton").addEventListener(
      "click",
      async function () {
        const client = getClient();
        if (!client) return;

        const button = this;
        button.disabled = true;
        button.textContent = "Logging Out...";

        try {
          const { error } = await client.auth.signOut();
          if (error) throw error;
          window.location.replace("login.html");
        } catch (error) {
          console.error("Logout error:", error);
          button.disabled = false;
          button.textContent = "Log Out";
          showMessage("Could not log out. Please try again.");
        }
      }
    );

    initialize();
  </script>
</body>
</html>
