<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | PasandMatrimony</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --primary: #8e245d;
      --secondary: #c04483;
      --background: #fff5fa;
      --text: #352334;
      --muted: #786879;
      --border: #eadce6;
    }

    body {
      margin: 0;
      padding: 20px 14px 40px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff5fa, #f5e8f6);
      color: var(--text);
    }

    .topbar {
      max-width: 760px;
      margin: 0 auto 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      color: var(--primary);
      font-size: 21px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand span {
      color: var(--secondary);
    }

    .nav-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .card {
      max-width: 760px;
      margin: auto;
      background: #fff;
      border: 1px solid #f0e2eb;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 15px 45px rgba(105, 34, 77, 0.10);
    }

    .hero {
      padding: 30px 24px;
      text-align: center;
      color: white;
      background: linear-gradient(120deg, #761c50, #bd4a87);
    }

    .hero-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 2px solid rgba(255, 255, 255, 0.5);
      font-size: 30px;
    }

    .hero h1 {
      margin: 0 0 9px;
      font-size: 27px;
    }

    .hero p {
      margin: 0;
      line-height: 1.6;
      font-size: 14px;
      color: #fff0f7;
    }

    .content {
      padding: 28px;
    }

    .account {
      padding: 12px 14px;
      background: #fff5fa;
      border: 1px solid #f0d9e7;
      border-radius: 10px;
      color: var(--primary);
      font-size: 13px;
      overflow-wrap: anywhere;
      margin-bottom: 24px;
    }

    .section-title {
      margin: 0 0 7px;
      font-size: 19px;
      color: var(--primary);
    }

    .section-description {
      margin: 0 0 23px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #493348;
    }

    input, select {
      width: 100%;
      min-height: 48px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus, select:focus {
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(192, 68, 131, .12);
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .save-button {
      width: 100%;
      min-height: 50px;
      margin-top: 25px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(100deg, #861d58, #bd4382);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(142, 36, 93, .20);
    }

    .save-button:hover {
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      display: none;
      padding: 12px 14px;
      border-radius: 9px;
      margin: 18px 0 0;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #message.visible {
      display: block;
    }

    #message.success {
      color: #17633b;
      background: #eaf8ef;
      border: 1px solid #c9ebd5;
    }

    #message.error {
      color: #9b2538;
      background: #fff0f1;
      border: 1px solid #f3cbd0;
    }

    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #f0e5ec;
    }

    .footer-actions a {
      color: var(--primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
    }

    .logout-button {
      padding: 10px 14px;
      border: 1px solid #e5c6d7;
      border-radius: 9px;
      background: white;
      color: var(--primary);
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px 10px 28px;
      }

      .brand {
        font-size: 18px;
      }

      .hero {
        padding: 25px 16px;
      }

      .hero h1 {
        font-size: 23px;
      }

      .content {
        padding: 21px 17px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 17px;
      }

      .field.full {
        grid-column: auto;
      }

      .footer-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="index.html">
      Pasand<span>Matrimony</span>
    </a>
    <a class="nav-link" href="index.html">Home</a>
  </header>

  <main class="card">
    <section class="hero">
      <div class="hero-icon">♥</div>
      <h1>Create Your Profile</h1>
      <p>Share your details and take the next step toward finding your life partner.</p>
    </section>

    <div class="content">
      <div id="account" class="account">Checking your account...</div>

      <h2 class="section-title">Personal Details</h2>
      <p class="section-description">
        Please enter accurate information so other members can get to know you better.
      </p>

      <form id="profileForm" hidden>
        <div class="form-grid">
          <div class="field full">
            <label for="fullName">Full Name *</label>
            <input id="fullName" type="text" maxlength="100"
                   placeholder="Enter your full name" autocomplete="name" required>
          </div>

          <div class="field">
            <label for="age">Age *</label>
            <input id="age" type="number" min="18" max="100"
                   placeholder="Enter your age" required>
          </div>

          <div class="field">
            <label for="city">City *</label>
            <input id="city" type="text" maxlength="100"
                   placeholder="Enter your city" autocomplete="address-level2" required>
          </div>

          <div class="field full">
            <label for="education">Education</label>
            <input id="education" type="text" maxlength="150"
                   placeholder="Enter your education">
          </div>

          <div class="field full">
            <label for="maritalStatus">Marital Status *</label>
            <select id="maritalStatus" required>
              <option value="">Select marital status</option>
              <option value="Never Married">Never Married</option>
              <option value="Divorced">Divorced</option>
              <option value="Widowed">Widowed</option>
              <option value="Widower">Widower</option>
            </select>
          </div>
        </div>

        <button id="saveButton" class="save-button" type="submit">
          Save Profile
        </button>
      </form>

      <p id="message" role="status" aria-live="polite"></p>

      <div class="footer-actions">
        <a href="index.html">← Back to Home</a>
        <button id="logoutButton" class="logout-button" type="button" hidden>
          Log Out
        </button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  <script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const account = document.getElementById("account");
    const saveButton = document.getElementById("saveButton");
    const logoutButton = document.getElementById("logoutButton");

    let currentUser = null;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "visible " + type;
    }

    async function initialize() {
      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error) throw error;

        currentUser = data.user;

        if (!currentUser) {
          account.textContent = "Please log in to create your profile.";
          return;
        }

        account.textContent = "Signed in as: " + currentUser.email;
        logoutButton.hidden = false;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("full_name, age, city, education, marital_status")
            .eq("id", currentUser.id)
            .maybeSingle();

        if (profileError) throw profileError;

        document.getElementById("fullName").value =
          profile?.full_name || currentUser.user_metadata?.full_name || "";
        document.getElementById("age").value = profile?.age ?? "";
        document.getElementById("city").value = profile?.city || "";
        document.getElementById("education").value = profile?.education || "";
        document.getElementById("maritalStatus").value =
          profile?.marital_status || "";

        form.hidden = false;
      } catch (error) {
        showMessage("Unable to load your profile: " + error.message, "error");
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!currentUser) {
        showMessage("Please log in before saving your profile.", "error");
        return;
      }

      saveButton.disabled = true;
      saveButton.textContent = "Saving...";
      message.className = "";
      message.textContent = "";

      try {
        const profile = {
          id: currentUser.id,
          full_name: document.getElementById("fullName").value.trim(),
          age: Number(document.getElementById("age").value),
          city: document.getElementById("city").value.trim(),
          education: document.getElementById("education").value.trim() || null,
          marital_status: document.getElementById("maritalStatus").value,
          updated_at: new Date().toISOString()
        };

        const { error } = await supabaseClient
          .from("profiles")
          .upsert(profile, { onConflict: "id" });

        if (error) throw error;

        showMessage("Your profile has been saved successfully!", "success");
      } catch (error) {
        showMessage("Unable to save your profile: " + error.message, "error");
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "Save Profile";
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) throw error;

        window.location.href = "login.html";
      } catch (error) {
        showMessage("Unable to log out: " + error.message, "error");
        logoutButton.disabled = false;
      }
    });

    initialize();
  </script>
</body>
</html>
