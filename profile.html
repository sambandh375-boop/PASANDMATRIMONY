<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>मेरी प्रोफाइल | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff5f7; color: #35212b;
    }
    .card {
      max-width: 560px; margin: 20px auto;
      padding: 25px; background: white;
      border-radius: 16px;
      box-shadow: 0 6px 24px #761c4018;
    }
    h1 { text-align: center; color: #761c40; }
    label { display: block; margin: 15px 0 6px; }
    input, select {
      width: 100%; padding: 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px; background: white;
    }
    button {
      width: 100%; padding: 13px; margin-top: 20px;
      border: 0; border-radius: 8px;
      background: #761c40; color: white;
      font-size: 16px; cursor: pointer;
    }
    button:disabled { opacity: .6; }
    p { text-align: center; overflow-wrap: anywhere; }
    a { color: #761c40; }
  </style>
</head>
<body>
  <main class="card">
    <h1>❤️ PasandMatrimony</h1>
    <p>अपनी मैट्रिमोनी प्रोफाइल भरें</p>
    <p id="account"></p>

    <form id="profileForm" hidden>
      <label for="fullName">पूरा नाम</label>
      <input id="fullName" maxlength="100" required>

      <label for="age">उम्र</label>
      <input id="age" type="number" min="18" max="100" required>

      <label for="city">शहर</label>
      <input id="city" maxlength="100" required>

      <label for="education">शिक्षा</label>
      <input id="education" maxlength="150">

      <label for="maritalStatus">वैवाहिक स्थिति</label>
      <select id="maritalStatus" required>
        <option value="">चुनें</option>
        <option value="अविवाहित">अविवाहित</option>
        <option value="तलाकशुदा">तलाकशुदा</option>
        <option value="विधवा">विधवा</option>
        <option value="विधुर">विधुर</option>
      </select>

      <button id="saveButton" type="submit">प्रोफाइल सेव करें</button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="index.html">होम पेज</a></p>
    <p><a href="login.html">लॉगिन पेज</a></p>
    <button id="logoutButton" type="button" hidden>लॉगआउट</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById("profileForm");
    const message = document.getElementById("message");
    const account = document.getElementById("account");
    const saveButton = document.getElementById("saveButton");
    const logoutButton = document.getElementById("logoutButton");
    let currentUser = null;

    async function initialize() {
      try {
        const { data, error } = await supabaseClient.auth.getUser();
        if (error) throw error;

        currentUser = data.user;
        if (!currentUser) {
          account.textContent = "प्रोफाइल बनाने के लिए पहले लॉगिन करें।";
          return;
        }

        account.textContent = "लॉगिन ईमेल: " + currentUser.email;
        logoutButton.hidden = false;

        const { data: profile, error: profileError } =
          await supabaseClient
            .from("profiles")
            .select("full_name, age, city, education, marital_status")
            .eq("id", currentUser.id)
            .maybeSingle();

        if (profileError) throw profileError;

        document.getElementById("fullName").value =
          profile?.full_name || currentUser.user_metadata?.full_name || "";
        document.getElementById("age").value = profile?.age || "";
        document.getElementById("city").value = profile?.city || "";
        document.getElementById("education").value = profile?.education || "";
        document.getElementById("maritalStatus").value =
          profile?.marital_status || "";

        form.hidden = false;
      } catch (error) {
        message.textContent = "त्रुटि: " + error.message;
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (!currentUser) {
        message.textContent = "पहले लॉगिन करें।";
        return;
      }

      saveButton.disabled = true;
      message.textContent = "प्रोफाइल सेव हो रही है...";

      try {
        const profile = {
          id: currentUser.id,
          full_name: document.getElementById("fullName").value.trim(),
          age: Number(document.getElementById("age").value),
          city: document.getElementById("city").value.trim(),
          education: document.getElementById("education").value.trim() || null,
          marital_status: document.getElementById("maritalStatus").value,
          updated_at: new Date().toISOString()
        };

        const { error } = await supabaseClient
          .from("profiles")
          .upsert(profile, { onConflict: "id" });

        if (error) throw error;
        message.textContent = "आपकी प्रोफाइल सफलतापूर्वक सेव हो गई!";
      } catch (error) {
        message.textContent = "सेव नहीं हुआ: " + error.message;
      } finally {
        saveButton.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      logoutButton.disabled = true;
      const { error } = await supabaseClient.auth.signOut();
      if (error) {
        message.textContent = "लॉगआउट त्रुटि: " + error.message;
        logoutButton.disabled = false;
        return;
      }
      window.location.href = "login.html";
    });

    initialize();
  </script>
</body>
</html>
