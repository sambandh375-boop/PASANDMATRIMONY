<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account | PasandMatrimony</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px 12px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff6f4,#f2e1e8);color:#35101f}
.card{max-width:620px;margin:auto;padding:24px;background:white;border:1px solid #f0dce2;border-radius:18px;box-shadow:0 12px 35px #46102618}
.brand{text-align:center;font-size:27px;font-weight:800;color:#651b35}
.brand span{color:#b76e79}
.subtitle{text-align:center;color:#786b70;margin:8px 0 22px}
h2{font-size:18px;margin-top:24px;padding-bottom:8px;border-bottom:1px solid #f0dce2}
.field{margin:15px 0}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:7px}
input,select{width:100%;padding:12px;border:1px solid #e5d2d9;border-radius:8px;background:white;font-size:15px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:8px;background:#651b35;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.message{display:none;padding:12px;border-radius:8px;margin:12px 0;line-height:1.5;overflow-wrap:anywhere}
.error{display:block;background:#fff0f0;color:#a21d2d}
.success{display:block;background:#eefaf1;color:#176534}
.links{text-align:center;margin-top:20px;font-size:14px;line-height:1.8}
a{color:#651b35;font-weight:bold}
small{color:#786b70;line-height:1.5}
</style>
</head>
<body>
<main class="card">
<div class="brand">♥ Pasand<span>Matrimony</span></div>
<p class="subtitle">Create your new account</p>
<div id="message" class="message" role="status" aria-live="polite"></div>

<form id="registerForm">
<h2>Account Details</h2>
<div class="field"><label for="fullName">Full Name *</label><input id="fullName" type="text" maxlength="100" autocomplete="name" required></div>
<div class="field"><label for="email">Email Address *</label><input id="email" type="email" autocomplete="email" required></div>
<div class="field"><label for="password">Password (Minimum 8 Characters) *</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div>
<div class="field"><label for="mobile">Mobile Number *</label><input id="mobile" type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required></div>

<h2>Profile Information</h2>
<div class="field"><label for="createdBy">Profile Created By *</label><select id="createdBy" required><option value="">Select option</option><option>Self</option><option>Parent</option><option>Brother</option><option>Sister</option><option>Guardian</option><option>Relative</option><option>Friend</option><option>Other</option></select></div>
<div class="field"><label for="profileFor">Profile For *</label><select id="profileFor" required><option value="">Select profile type</option><option value="Bride">Bride</option><option value="Groom">Groom</option></select></div>
<div class="field"><label for="gender">Gender *</label><select id="gender" required><option value="">Select gender</option><option value="Female">Female</option><option value="Male">Male</option></select></div>
<div class="field"><label for="maritalStatus">Marital Status *</label><select id="maritalStatus" required><option value="">Select marital status</option><option>Never Married</option><option>Divorced</option><option>Widowed</option><option>Separated</option></select></div>
<div class="field"><label for="religion">Religion *</label><select id="religion" required><option value="">Select religion</option><option>Hindu</option><option>Muslim</option><option>Christian</option><option>Sikh</option><option>Jain</option><option>Buddhist</option><option>Other</option><option>Prefer Not to Say</option></select></div>

<div class="field"><label for="state">State / Union Territory *</label><select id="state" required><option value="">Loading states...</option></select></div>
<div class="field"><label for="district">District *</label><select id="district" required disabled><option value="">Select state first</option></select></div>
<div class="field"><label for="city">City / Urban Local Body *</label><select id="city" required disabled><option value="">Select district first</option></select></div>

<div class="field"><label for="education">Highest Education *</label><select id="education" required><option value="">Select education</option><option>Below 10th</option><option>10th Pass</option><option>12th Pass</option><option>Diploma</option><option>Graduate</option><option>Postgraduate</option><option>Doctorate</option><option>Professional Degree</option><option>Other</option></select></div>
<div class="field"><label for="occupation">Occupation *</label><select id="occupation" required><option value="">Select occupation</option><option>Government Job</option><option>Private Job</option><option>Business</option><option>Self-employed</option><option>Teacher</option><option>Doctor</option><option>Engineer</option><option>Farmer</option><option>Student</option><option>Homemaker</option><option>Retired</option><option>Not Working</option><option>Other</option></select></div>

<p><small>Registration is free. You can add more profile details after creating your account.</small></p>
<button id="registerButton" type="submit">Create Account</button>
</form>
<div class="links">Already have an account? <a id="loginLink" href="login.html">Login Here</a><br><a href="index.html">Back to Home</a></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
"use strict";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("registerButton");
const stateSelect = document.getElementById("state");
const districtSelect = document.getElementById("district");
const citySelect = document.getElementById("city");
const API = "https://lgd-json-api.vercel.app/api";

function showMessage(text,type){
  message.textContent=text;
  message.className="message "+type;
}

async function getAllPages(endpoint, params={}){
  let results=[];
  for(let page=1; page<=100; page++){
    const query=new URLSearchParams({...params,page:String(page),limit:"100"});
    const response=await fetch(`${API}/${endpoint}?${query.toString()}`);
    if(!response.ok) throw new Error(`Location data request failed (${response.status}).`);
    const json=await response.json();
    const rows=Array.isArray(json.data)?json.data:
      Array.isArray(json.results)?json.results:
      Array.isArray(json)?json:[];
    results=results.concat(rows);
    const totalPages=Number(json.pagination?.totalPages || json.pagination?.total_pages || 0);
    if(rows.length===0 || (totalPages && page>=totalPages) || (!totalPages && rows.length<100)) break;
  }
  return results;
}

function nameOf(item){
  return String(item.name || item.stateName || item.districtName || item.cityName || item.localBodyName || item.state_name || item.district_name || item.city_name || "").trim();
}
function codeOf(item,level){
  const keys={
    state:["stateCode","state_code","lgdStateCode","code","lgdCode","id"],
    district:["districtCode","district_code","lgdDistrictCode","code","lgdCode","id"],
    city:["ulbCode","cityCode","city_code","localBodyCode","lgdCode","code","id"]
  }[level];
  for(const key of keys){if(item[key]!==undefined && item[key]!==null)return String(item[key]);}
  return "";
}
function addOptions(select,items,level,placeholder){
  select.innerHTML="";
  const first=document.createElement("option");
  first.value="";
  first.textContent=placeholder;
  select.appendChild(first);
  const seen=new Set();
  items.sort((a,b)=>nameOf(a).localeCompare(nameOf(b)));
  for(const item of items){
    const name=nameOf(item), code=codeOf(item,level);
    if(!name || !code || seen.has(code)) continue;
    seen.add(code);
    const option=document.createElement("option");
    option.value=code;
    option.textContent=name;
    select.appendChild(option);
  }
  select.disabled=seen.size===0;
  if(seen.size===0) first.textContent="No options available";
}

let statesData=[];
let districtsData=[];
let citiesData=[];

async function loadStates(){
  stateSelect.disabled=true;
  try{
    statesData=await getAllPages("states");
    addOptions(stateSelect,statesData,"state","Select state or union territory");
    if(!statesData.length) throw new Error("No states were returned by the API.");
  }catch(error){
    stateSelect.innerHTML='<option value="">Could not load states</option>';
    showMessage("Could not load state list. Please refresh and try again. "+error.message,"error");
  }
}

stateSelect.addEventListener("change",async()=>{
  const selected=statesData.find(s=>codeOf(s,"state")===stateSelect.value);
  districtSelect.innerHTML='<option value="">Loading districts...</option>';
  districtSelect.disabled=true;
  citySelect.innerHTML='<option value="">Select district first</option>';
  citySelect.disabled=true;
  if(!selected)return;
  const stateCode=codeOf(selected,"state");
  try{
    districtsData=await getAllPages("districts",{stateCode});
    addOptions(districtSelect,districtsData,"district","Select district");
    if(!districtsData.length) showMessage("No districts returned for this state. Check the API response format.","error");
    else {message.className="message";message.textContent="";}
  }catch(error){
    districtSelect.innerHTML='<option value="">Could not load districts</option>';
    showMessage("Could not load districts. "+error.message,"error");
  }
});

districtSelect.addEventListener("change",async()=>{
  const selected=districtsData.find(d=>codeOf(d,"district")===districtSelect.value);
  citySelect.innerHTML='<option value="">Loading cities...</option>';
  citySelect.disabled=true;
  if(!selected)return;
  const districtCode=codeOf(selected,"district");
  const stateCode=codeOf(statesData.find(s=>s.name===stateSelect.options[stateSelect.selectedIndex]?.textContent)||{},"state");
  try{
    citiesData=await getAllPages("cities",{districtCode});
    if(!citiesData.length && stateCode) citiesData=await getAllPages("cities",{stateCode});
    const related=citiesData.filter(c=>{
      const parentDistrict=String(c.districtCode ?? c.district_code ?? c.parentDistrictCode ?? "");
      return !parentDistrict || parentDistrict===districtCode;
    });
    addOptions(citySelect,related,"city","Select city / urban local body");
    if(!related.length) showMessage("No city records were found for this district. The API may only list urban local bodies.","error");
    else {message.className="message";message.textContent="";}
  }catch(error){
    citySelect.innerHTML='<option value="">Could not load cities</option>';
    showMessage("Could not load city list. "+error.message,"error");
  }
});

const params=new URLSearchParams(location.search);
const allowedPlans=["office","gold","diamond","platinum","platinum_plus"];
const requestedPlan=params.get("plan")||"";
const selectedPlan=allowedPlans.includes(requestedPlan)?requestedPlan:"";
if(selectedPlan) document.getElementById("loginLink").href="login.html?plan="+encodeURIComponent(selectedPlan);

form.addEventListener("submit",async event=>{
  event.preventDefault();
  const client=typeof supabaseClient!=="undefined"?supabaseClient:window.supabaseClient;
  if(!client || !client.auth){
    showMessage("Supabase connection is unavailable. Check supabase-config.js and the Project URL and Publishable Key.","error");
    return;
  }
  const fullName=document.getElementById("fullName").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const mobile=document.getElementById("mobile").value.trim();
  const createdBy=document.getElementById("createdBy").value;
  const profileFor=document.getElementById("profileFor").value;
  const gender=document.getElementById("gender").value;
  const maritalStatus=document.getElementById("maritalStatus").value;
  const religion=document.getElementById("religion").value;
  const state=stateSelect.options[stateSelect.selectedIndex]?.textContent||"";
  const district=districtSelect.options[districtSelect.selectedIndex]?.textContent||"";
  const city=citySelect.options[citySelect.selectedIndex]?.textContent||"";
  const education=document.getElementById("education").value;
  const occupation=document.getElementById("occupation").value;

  if(!/^[0-9]{10}$/.test(mobile)){
    showMessage("Please enter a valid 10-digit mobile number.","error");return;
  }
  if(password.length<8){
    showMessage("Password must contain at least 8 characters.","error");return;
  }
  if(!stateSelect.value || !districtSelect.value || !citySelect.value){
    showMessage("Please select your state, district, and city.","error");return;
  }

  button.disabled=true;
  button.textContent="Creating Account...";
  try{
    const {data,error}=await client.auth.signUp({
      email,password,
      options:{data:{
        full_name:fullName,mobile,profile_created_by:createdBy,
        profile_type:profileFor,gender,marital_status:maritalStatus,
        religion,state,district,city,education,occupation,
        state_code:stateSelect.value,district_code:districtSelect.value,
        city_code:citySelect.value,selected_plan:selectedPlan||null
      }}
    });
    if(error)throw error;
    if(data.session){
      showMessage("Account created successfully. Redirecting...","success");
      const destination=selectedPlan?"payment.html?plan="+encodeURIComponent(selectedPlan):"profile.html";
      setTimeout(()=>location.href=destination,1200);
    }else{
      showMessage("Registration submitted. Check your email if confirmation is required, then log in.","success");
      button.disabled=false;button.textContent="Create Account";
    }
  }catch(error){
    showMessage(error.message||"Registration failed. Please try again.","error");
    button.disabled=false;button.textContent="Create Account";
  }
});

loadStates();
</script>
</body>
</html>
