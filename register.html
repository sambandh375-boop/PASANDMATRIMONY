<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>रजिस्ट्रेशन | PasandMatrimony</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: Arial, sans-serif;
      background: #fff5f7; color: #35212b;
    }
    .card {
      max-width: 500px; margin: 20px auto;
      padding: 25px; background: white;
      border-radius: 16px; box-shadow: 0 6px 24px #761c4018;
    }
    h1 { text-align: center; color: #761c40; }
    label { display: block; margin: 15px 0 6px; }
    input, select {
      width: 100%; padding: 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%; padding: 13px; margin-top: 20px;
      background: #761c40; color: white;
      border: 0; border-radius: 8px;
      font-size: 16px; cursor: pointer;
    }
    p { text-align: center; }
    a { color: #761c40; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="card">
    <h1>❤️ PasandMatrimony</h1>
    <p>अपना नया अकाउंट बनाएँ</p>

    <form id="registerForm">
      <label for="fullName">पूरा नाम</label>
      <input id="fullName" required maxlength="100">

      <label for="email">ईमेल</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">पासवर्ड (कम से कम 8 अक्षर)</label>
      <input id="password" type="password" minlength="8"
             required autocomplete="new-password">

      <label for="gender">प्रोफाइल</label>
      <select id="gender" required>
        <option value="">चुनें</option>
        <option value="male">वर</option>
        <option value="female">वधू</option>
        <option value="other">अन्य</option>
      </select>

      <button id="submitButton" type="submit">रजिस्ट्रेशन करें</button>
      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <p>पहले से अकाउंट है? <a href="login.html">लॉगिन करें</a></p>
    <p><a href="index.html">होम पेज</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("submitButton");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      button.disabled = true;
      message.textContent = "रजिस्ट्रेशन हो रहा है...";

      try {
        const fullName = document.getElementById("fullName").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const gender = document.getElementById("gender").value;

        const { data, error } = await supabaseClient.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName, gender }
          }
        });

        if (error) throw error;

        if (data.session) {
          message.textContent =
            "अकाउंट बन गया! अब लॉगिन/प्रोफाइल की सुविधा आगे जोड़ेंगे।";
        } else {
          message.textContent =
            "रजिस्ट्रेशन अनुरोध सफल है। यदि ईमेल पुष्टि चालू है, तो अपना ईमेल खोलकर अकाउंट सत्यापित करें।";
        }
      } catch (error) {
        message.textContent = "त्रुटि: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
